name: Public release audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build sanitized release snapshot
        run: python scripts/build_public_release_snapshot.py --output "$RUNNER_TEMP/ivdd-public-release"
      - name: Audit staged public release
        run: python scripts/audit_public_release.py "$RUNNER_TEMP/ivdd-public-release"
